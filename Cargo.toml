[package]
name = "herdr"
version = "0.6.6"
edition = "2021"
build = "build.rs"
default-run = "herdr"
description = "terminal workspace manager for AI coding agents"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ogulcancelik/herdr"
homepage = "https://herdr.dev"
keywords = ["terminal", "tui", "ai", "agents", "multiplexer"]
categories = ["command-line-utilities"]
include = ["src/**/*", "assets/sounds/*", "README.md", "LICENSE", "Cargo.toml"]

[dependencies]
base64 = "0.22.1"
bincode = { version = "2", features = ["serde"] }
bytes = "1"
crossterm = "0.29"
ctrlc = "3"
libc = "0.2"
portable-pty = "0.9"
png = "0.17"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "0.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
syntect = { version = "5.2", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }
once_cell = "1.19"
typst = "0.11"
comemo = "0.4"
typst-assets = { version = "0.11", features = ["fonts"] }
typst-svg = "0.11"
mitex = "0.2.4"
resvg = "0.38"
tiny-skia = "0.11"
gh-emoji = "1.0"



[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
cpal = "0.15"

[[bin]]
name = "herdr"
path = "src/main.rs"







